<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GARUDA — Crime Intelligence Workbench</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body class="has-classify">
<div class="classify">Restricted &middot; authorized SCRB personnel only &middot; synthetic data environment</div>

<!-- icon sprite (Lucide-style, stroke) -->

<g id="i-net" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="7" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M7.8 7.6l3 7M16.4 8.8l-3 6.4M8 6.4h7.6"/></g>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark"><svg><use href="#i-shield"/></svg></span>
      <div><h1>GARUDA</h1><div class="sub">Crime Intelligence</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">Operations</div>
      <a data-view="overview" class="active"><svg><use href="#i-grid"/></svg> Overview</a>
      <a data-view="network"><svg><use href="#i-net"/></svg> Network Reveal <span class="pip" id="nav-rings">·</span></a>
      <a data-view="map"><svg><use href="#i-map"/></svg> Hotspot Map</a>
      <div class="lbl">Intelligence</div>
      <a data-view="copilot"><svg><use href="#i-chat"/></svg> Copilot</a>
      <a data-view="alerts"><svg><use href="#i-siren"/></svg> Alerts &amp; Risk <span class="pip" id="nav-alerts">·</span></a>
    </nav>
    <div class="sidewho">
      <span class="avatar">SR</span>
      <div style="flex:1;min-width:0">
        <div class="nm">S. Rogers</div>
        <div class="rl" id="rolelabel">SCRB · Admin</div>
        <select class="role-sel" id="roleswitch" aria-label="Switch role (governance demo)">
          <option value="scrb-admin|">scrb-admin · state</option>
          <option value="analyst|">analyst · read-all, PII-masked</option>
          <option value="district|BNU">district · BNU</option>
          <option value="station|BNU20">station · BNU20</option>
          <option value="ethics|">ethics · audit only</option>
        </select>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb">GARUDA <b id="crumb">/ Overview</b></div>
      <div class="searchwrap">
        <div class="searchbox">
          <svg><use href="#i-search"/></svg>
          <input id="globalq" placeholder="Search cases, people, plates, phones — or ask…" autocomplete="off" />
          <kbd>Ctrl K</kbd>
        </div>
        <div class="searchdrop" id="searchdrop"></div>
      </div>
      <div class="clock" id="clock"></div>
      <div class="env"><span class="dot ok"></span> DEV · synthetic</div>
    </header>

    <div class="tabstrip" id="tabstrip"></div>

    <main class="content" id="content">
      <section id="view-overview" class="view active"></section>
      <section id="view-network" class="view"></section>
      <section id="view-map" class="view"></section>
      <section id="view-copilot" class="view"></section>
      <section id="view-alerts" class="view"></section>
    </main>
  </div>
</div>

<div class="tip" id="tip"></div>
<script src="assets/graph.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
