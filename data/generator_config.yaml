# Organizer schema: CaseMaster.CaseCategoryID -> CaseCategory (FIR/UDR/PAR/Zero-FIR).
# `digit` is the leading digit of the real CrimeNo format (1+4+4+4+5).
case_categories:
  - { code: FIR,      digit: "1", weight: 90 }
  - { code: Zero-FIR,  digit: "8", weight: 4 }
  - { code: UDR,       digit: "3", weight: 4 }
  - { code: PAR,       digit: "4", weight: 2 }

# GravityOffence.LookupValue — crimes not listed default to Non-Heinous.
heinous_crimes: [Murder, Dacoity, Kidnapping, Robbery]

# Employee roster (Rank/Designation/Unit posting) — who registers/investigates FIRs.
officers:
  n_officers: 220
  ranks:
    - { name: Constable,      weight: 40 }
    - { name: Head Constable, weight: 20 }
    - { name: ASI,            weight: 15 }
    - { name: PSI,            weight: 12 }
    - { name: PI,             weight: 8 }
    - { name: CPI,            weight: 3 }
    - { name: DySP,           weight: 2 }
  designations: [Investigating Officer, SHO, Beat Officer, Cyber Cell, Traffic]

# ChargesheetDetails — only cases past investigation get a final-report row.
# cstype: A=Chargesheet, B=False Case, C=Undetected (per the organizer schema).
chargesheet:
  eligible_statuses: [Chargesheeted, Closed, Final Report]
  cstype_weights: { A: 0.72, B: 0.10, C: 0.18 }
  days_to_chargesheet: [30, 180]

planted:
  network:
    crime_type: Chain snatching
    n_incidents: 10
    districts: [BNU, RMN, TMK, KLR]   # >=3 districts; the cross-district reveal
    n_members: 5                      # persons in the gang
    kingpin_presence: 0.8             # kingpin appears in ~80% of the incidents
    window: { start: 2024-11-01, end: 2025-01-31 }
  series:
    crime_type: House burglary
    district: MYS
    n_incidents: 6
    window_days: 14
    locality_jitter_deg: 0.01         # ~1 km tight cluster
  # Target high-volume district x crime cells so a 3-4x spike is meaningful.
  # injection = baseline * (multiplier - 1), computed at runtime (floor keeps it visible).
  # Avoid cells used by the network (Chain snatching in BNU/RMN/TMK/KLR, Nov-Jan)
  # and the series (House burglary in MYS).
  anomalies:
    - { district: BNU, crime_type: Two-wheeler theft, month: 2025-03, multiplier: 4.0 }
    - { district: BNU, crime_type: House burglary,    month: 2025-04, multiplier: 3.5 }
    - { district: MYS, crime_type: Two-wheeler theft, month: 2024-09, multiplier: 3.5 }
