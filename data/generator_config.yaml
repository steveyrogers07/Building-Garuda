# Organizer schema: CaseMaster.CaseCategoryID -> CaseCategory (FIR/UDR/PAR/Zero-FIR).
# `digit` is the leading digit of the real CrimeNo format (1+4+4+4+5).
case_categories:
  - { code: FIR,      digit: "1", weight: 90 }
  - { code: Zero-FIR,  digit: "8", weight: 4 }
  - { code: UDR,       digit: "3", weight: 4 }
  - { code: PAR,       digit: "4", weight: 2 }

# GravityOffence.LookupValue — crimes not listed default to Non-Heinous.
heinous_crimes: [Murder, Dacoity, Kidnapping, Robbery]

# Employee roster (Rank/Designation/Unit posting) — who registers/investigates FIRs.
officers:
  n_officers: 220
  ranks:
    - { name: Constable,      weight: 40 }
    - { name: Head Constable, weight: 20 }
    - { name: ASI,            weight: 15 }
    - { name: PSI,            weight: 12 }
    - { name: PI,             weight: 8 }
    - { name: CPI,            weight: 3 }
    - { name: DySP,           weight: 2 }
  designations: [Investigating Officer, SHO, Beat Officer, Cyber Cell, Traffic]
  # Employee.KGID/EmployeeDOB/BloodGroupID/AppointmentDate — not analytics-load-bearing
  # (hence P2), but real organizer columns; schema-complete rather than schema-thin.
  blood_groups:
    - { name: "O+",  weight: 35 }
    - { name: "A+",  weight: 22 }
    - { name: "B+",  weight: 30 }
    - { name: "AB+", weight: 6 }
    - { name: "O-",  weight: 3 }
    - { name: "A-",  weight: 2 }
    - { name: "B-",  weight: 1.5 }
    - { name: "AB-", weight: 0.5 }
  years_of_service: [2, 28]     # appointment_date = dataset start - N years; dob = appointment - (22..35)
  age_at_appointment: [22, 35]

# CaseStatusMaster — the master lookup Incidents.status denormalizes from (P2 #10).
# Reference-only: rows come straight from status_weights' keys, no per-incident RNG.
case_status_master: true

# Court — organizer schema's Court, referenced by both CaseMaster.CourtID (which
# court is trying the case) and ArrestSurrender.CourtID (production court). 3 courts
# per district matches Arrests' existing CRT-{district}-{01..03} id scheme, so
# already-generated arrests.csv needs no changes to become valid foreign keys.
courts:
  per_district: 3
  names: ["District & Sessions Court", "Court of JMFC-I", "Court of JMFC-II"]
  # cases get a court assigned once they reach trial-eligible posture
  eligible_statuses: [Chargesheeted, Pending Trial, Closed, Final Report]

# CrimeHeadActSection — organizer's 2-level crime classification (CrimeHead's
# major group -> the act+sections typically filed under it). Reference table,
# derived from crime_types' primary code + case_sections.companions, no RNG.
crime_heads:
  Offences Against the Human Body: [Murder, Assault, Grievous hurt, Kidnapping, Rioting]
  Offences Against Property: [Two-wheeler theft, Theft, House burglary, Chain snatching,
                               Robbery, Motor vehicle theft, Dacoity, Criminal trespass]
  Economic & Cyber Offences: [Cheating, Cybercrime, Criminal breach of trust]

# ChargesheetDetails — only cases past investigation get a final-report row.
# cstype: A=Chargesheet, B=False Case, C=Undetected (per the organizer schema).
chargesheet:
  eligible_statuses: [Chargesheeted, Closed, Final Report]
  cstype_weights: { A: 0.72, B: 0.10, C: 0.18 }
  days_to_chargesheet: [30, 180]

# ArrestSurrender — arrest/surrender events per accused suspect. Starts the CrPC/BNSS
# 60/90-day default-bail clock (docs/product/08 §1); suspects with no row here on an
# open case are the absconding-accused board (08 §6).
arrests:
  surrender_fraction: 0.08          # share of events that are surrenders, not arrests
  p_arrested_by_posture:            # P(a named suspect has been arrested), per case posture
    chargesheeted_A: 0.85           # final report filed — accused mostly in custody/on bail
    false_or_undetected: 0.05       # cs_type B/C — (correctly) nobody in custody
    pending_trial: 0.90
    under_investigation: 0.55       # the live 60/90-day-clock population (08 §1)
  days_after_report: [0, 45]        # arrest lag for pending-trial cases: report -> arrest
  open_case_recency_days: 100       # open-case arrests skew recent: old arrests resolve
                                    # (chargesheet or default bail) and leave the pool
  # ArrestSurrender.IsAccused/IsComplainantAccused (P2 #9): IsAccused distinguishes the
  # primary accused (first-listed suspect) from co-accused; IsComplainantAccused is the
  # rare cross-role case worth flagging for the false-case pattern (08 §7-adjacent).
  p_complainant_accused: 0.015

# CaseMaster.IncidentToDate/InfoReceivedPSDate (P2 #8) + VictimPolice (P2 #12) — none
# of these gate any engine; they round out the schema so nothing an ER-literate judge
# checks for is a text field alone.
incident_extra:
  incident_to_date_hours: [0, 6]     # most crimes are point-in-time; a few run a few hours
  info_received_lag_hours: [0, 8]    # info reaches the PS informally before formal registration
  p_victim_is_police: 0.02           # VictimPolice — an on-duty officer as the victim

# ActSectionAssociation — real FIRs invoke several act+sections, not one. The incident's
# ipc_bns_code stays the primary/most-serious (section_order 1); companions add 2..n.
# Companion {ipc,bns} pairs must exist in data/reference/ipc_bns_map.csv (the coverage
# reference); {act,section} entries are statute-fixed (IT Act cites the same section
# whether the case is coded IPC or BNS).
case_sections:
  extra_weights: { 0: 0.30, 1: 0.40, 2: 0.22, 3: 0.08 }   # companions per case
  companions:
    Two-wheeler theft:        [ { ipc: "411", bns: "317(2)" }, { ipc: "34", bns: "3(5)" } ]
    Theft:                    [ { ipc: "411", bns: "317(2)" }, { ipc: "34", bns: "3(5)" } ]
    Motor vehicle theft:      [ { ipc: "411", bns: "317(2)" }, { ipc: "34", bns: "3(5)" } ]
    House burglary:           [ { ipc: "380", bns: "305" }, { ipc: "411", bns: "317(2)" }, { ipc: "34", bns: "3(5)" } ]
    Chain snatching:          [ { ipc: "379", bns: "303(2)" }, { ipc: "411", bns: "317(2)" }, { ipc: "34", bns: "3(5)" } ]
    Assault:                  [ { ipc: "506", bns: "351(2)" }, { ipc: "341", bns: "126(2)" }, { ipc: "34", bns: "3(5)" } ]
    Cheating:                 [ { ipc: "406", bns: "316(2)" }, { ipc: "120B", bns: "61(2)" }, { act: IT_ACT, section: "66D" } ]
    Robbery:                  [ { ipc: "384", bns: "308(2)" }, { ipc: "506", bns: "351(2)" }, { ipc: "34", bns: "3(5)" } ]
    Cybercrime:               [ { act: IT_ACT, section: "66C" }, { act: IT_ACT, section: "66D" }, { ipc: "120B", bns: "61(2)" } ]
    Grievous hurt:            [ { ipc: "326", bns: "118(1)" }, { ipc: "506", bns: "351(2)" }, { ipc: "34", bns: "3(5)" } ]
    Criminal breach of trust: [ { ipc: "420", bns: "318(4)" }, { ipc: "120B", bns: "61(2)" } ]
    Rioting:                  [ { ipc: "149", bns: "190" }, { ipc: "323", bns: "115(2)" }, { ipc: "506", bns: "351(2)" } ]
    Criminal trespass:        [ { ipc: "506", bns: "351(2)" }, { ipc: "341", bns: "126(2)" } ]
    Dacoity:                  [ { ipc: "412", bns: "317(3)" }, { ipc: "120B", bns: "61(2)" }, { ipc: "34", bns: "3(5)" } ]
    Murder:                   [ { ipc: "201", bns: "238" }, { ipc: "34", bns: "3(5)" }, { ipc: "120B", bns: "61(2)" } ]
    Kidnapping:               [ { ipc: "364A", bns: "140(2)" }, { ipc: "506", bns: "351(2)" }, { ipc: "34", bns: "3(5)" } ]

planted:
  network:
    crime_type: Chain snatching
    n_incidents: 10
    districts: [BNU, RMN, TMK, KLR]   # >=3 districts; the cross-district reveal
    n_members: 5                      # persons in the gang
    kingpin_presence: 0.8             # kingpin appears in ~80% of the incidents
    window: { start: 2024-11-01, end: 2025-01-31 }
  series:
    crime_type: House burglary
    district: MYS
    n_incidents: 6
    window_days: 14
    locality_jitter_deg: 0.01         # ~1 km tight cluster
  # Target high-volume district x crime cells so a 3-4x spike is meaningful.
  # injection = baseline * (multiplier - 1), computed at runtime (floor keeps it visible).
  # Avoid cells used by the network (Chain snatching in BNU/RMN/TMK/KLR, Nov-Jan)
  # and the series (House burglary in MYS).
  anomalies:
    - { district: BNU, crime_type: Two-wheeler theft, month: 2025-03, multiplier: 4.0 }
    - { district: BNU, crime_type: House burglary,    month: 2025-04, multiplier: 3.5 }
    - { district: MYS, crime_type: Two-wheeler theft, month: 2024-09, multiplier: 3.5 }
