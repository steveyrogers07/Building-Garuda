# GARUDA — synthetic generator configuration (parameterised; never hardcode in code).
# Consumed by data/generate.py. Keep the seed fixed so ground_truth.json stays valid.

seed: 20260618

counts:
  n_incidents: 10000          # total incidents incl. planted (dev-tier safe: 10-20k)
  persons_canonical: 7000     # base canonical persons (aliases added on top)
  alias_fraction: 0.25        # share of persons that get 1..max_aliases variants
  max_aliases: 3
  vehicles: 2200
  phones: 1800
  active_offender_fraction: 0.10   # small set of repeat offenders (denser graph)

dates:
  start: 2024-01-01
  end: 2025-06-30
  weekend_boost: 1.25         # Fri/Sat/Sun
  month_end_boost: 1.5        # last 3 days of month
  festivals:                  # date +/- window_days gets a multiplicative boost
    - { name: Sankranti,         date: 2025-01-14, window_days: 2, boost: 1.6 }
    - { name: Ugadi-2024,        date: 2024-04-09, window_days: 2, boost: 1.5 }
    - { name: Ganesh-Chaturthi,  date: 2024-09-07, window_days: 2, boost: 1.6 }
    - { name: Dasara-2024,       date: 2024-10-12, window_days: 4, boost: 1.9 }
    - { name: Deepavali-2024,    date: 2024-10-31, window_days: 3, boost: 2.0 }
    - { name: Ugadi-2025,        date: 2025-03-30, window_days: 2, boost: 1.5 }

# Crime types night-skew their timing; these are "day" crimes (office-hours-ish).
day_crimes: [Cheating, Cybercrime, Criminal breach of trust]

bns_ratio: 0.60               # ~60% incidents coded in BNS, ~40% IPC

status_weights:
  Under Investigation: 0.45
  Chargesheeted: 0.22
  Pending Trial: 0.12
  Closed: 0.12
  Final Report: 0.09

