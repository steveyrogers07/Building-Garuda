<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" role="img">
<title>GARUDA six-layer architecture mapped to Catalyst services</title>
<rect x="0" y="0" width="1000" height="660" fill="#FFFFFF"/>
