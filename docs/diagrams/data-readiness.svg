<svg viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif" role="img">
<title>Data readiness adapter pattern</title>
<rect x="0" y="0" width="980" height="320" fill="#FFFFFF"/>
<defs>
<marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#8A93A0"/></marker>
<style>
.dt{fill:#1B2230;font-weight:700;font-size:14px;}
.b1{fill:#1B2230;font-weight:700;font-size:12px;}
.b2{fill:#5B6472;font-size:10px;}
.w1{fill:#FFFFFF;font-weight:700;font-size:12.5px;}
.w2{fill:#D7E6F2;font-size:9.5px;}
.note{fill:#5B6472;font-size:11px;}
.cn{stroke:#8A93A0;stroke-width:1.6;fill:none;}
</style>
</defs>
<text x="24" y="26" class="dt">Data-readiness: build behind an adapter — swap the data, not the code</text>
<rect x="24" y="66" width="200" height="58" rx="8" fill="#E7F0F8" stroke="#2F6F9F" stroke-width="1.5"/>
<text x="124" y="90" text-anchor="middle" class="b1">Synthetic data (now)</text>
<text x="124" y="108" text-anchor="middle" class="b2">shaped like expected schema</text>
<rect x="24" y="146" width="200" height="58" rx="8" fill="#F5F3EE" stroke="#9AA1AC" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="124" y="170" text-anchor="middle" class="b1">Real KSP dataset (later)</text>
<text x="124" y="188" text-anchor="middle" class="b2">drops in when it arrives</text>
<rect x="300" y="92" width="190" height="86" rx="8" fill="#1F567E" stroke="#1F567E"/>
<text x="395" y="124" text-anchor="middle" class="w1">ADAPTER / LOADER</text>
<text x="395" y="143" text-anchor="middle" class="w2">column-map + validate</text>
<text x="395" y="162" text-anchor="middle" class="w2">← the only part you rewrite</text>
<rect x="560" y="100" width="150" height="70" rx="8" fill="#F5F3EE" stroke="#D3CDBF" stroke-width="1.5"/>
<text x="635" y="130" text-anchor="middle" class="b1">Canonical schema</text>
<text x="635" y="148" text-anchor="middle" class="b2">Data Store tables</text>
<rect x="760" y="72" width="200" height="126" rx="8" fill="#E7F0F8" stroke="#2F6F9F" stroke-width="1.5"/>
<text x="860" y="100" text-anchor="middle" class="b1">Engines + Frontend</text>
<text x="860" y="122" text-anchor="middle" class="b2">resolution · MO · network</text>
<text x="860" y="140" text-anchor="middle" class="b2">forecast · anomaly · copilot</text>
<text x="860" y="158" text-anchor="middle" class="b2">maps · graph · dashboards</text>
<text x="860" y="182" text-anchor="middle" class="b1">( unchanged )</text>
<line class="cn" x1="224" y1="95" x2="300" y2="120" marker-end="url(#ard)"/>
<line class="cn" x1="224" y1="175" x2="300" y2="150" marker-end="url(#ard)"/>
<line class="cn" x1="490" y1="135" x2="560" y2="135" marker-end="url(#ard)"/>
<line class="cn" x1="710" y1="135" x2="760" y2="135" marker-end="url(#ard)"/>
<text x="24" y="250" class="note">When the real dataset arrives: rewrite the column-map, run profiling + validation, reload.</text>
<text x="24" y="270" class="note">Every engine, model, and screen downstream stays exactly the same — so you lose zero time.</text>
</svg>
