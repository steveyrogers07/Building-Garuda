# GARUDA — column map: SOURCE columns -> canonical fields, per table.
#
# THE SWAP POINT. When the real KSP dataset arrives, copy this file to
# column_map.ksp.yaml and change ONLY the `source:` names and `transform:`s here —
# nothing downstream (validator, loader, engines, frontend) changes.
#
# Per field:  <canonical_field>: { source: <source_column>, transform: <datetime|int|float|str> }
# A missing `source` defaults to the canonical name; a missing `transform` means string.
# Fields not listed are left empty (e.g. mo_cluster_id / series_id are filled in later phases).

Incidents:
  fields:
    incident_id:    { source: incident_id }
    fir_no:         { source: fir_no }
    crime_no:       { source: crime_no }
    case_no:        { source: case_no }
    occurred_at:    { source: occurred_at, transform: datetime }
    reported_at:    { source: reported_at, transform: datetime }
    district_code:  { source: district_code }
    station_code:   { source: station_code }
    crime_type:     { source: crime_type }
    ipc_bns_code:   { source: ipc_bns_code }
    lat:            { source: lat,  transform: float }
    long:           { source: long, transform: float }
    address_text:   { source: address_text }
    mo_text:        { source: mo_text }
    status:         { source: status }
    case_category:  { source: case_category }
    gravity:        { source: gravity }
    officer_id:     { source: officer_id }
    incident_to_date:      { source: incident_to_date, transform: datetime }
    info_received_ps_date: { source: info_received_ps_date, transform: datetime }
    court_id:               { source: court_id }
    source_fir_url: { source: source_fir_url }
    confidence:     { source: confidence, transform: float }
    created_by:     { source: created_by }

Officers:
  fields:
    officer_id:    { source: officer_id }
    name:          { source: name }
    rank:          { source: rank }
    designation:   { source: designation }
    district_code: { source: district_code }
    unit_code:     { source: unit_code }
    kgid:              { source: kgid }
    dob:               { source: dob, transform: datetime }
    blood_group:       { source: blood_group }
    appointment_date:  { source: appointment_date, transform: datetime }

Chargesheets:
  fields:
    cs_id:       { source: cs_id }
    incident_id: { source: incident_id }
    cs_date:     { source: cs_date, transform: datetime }
    cs_type:     { source: cs_type }
    officer_id:  { source: officer_id }

Arrests:
  fields:
    arrest_id:     { source: arrest_id }
    incident_id:   { source: incident_id }
    entity_id:     { source: entity_id }
    event_type:    { source: event_type }
    event_date:    { source: event_date, transform: datetime }
    district_code: { source: district_code }
    court_id:      { source: court_id }
    io_officer_id: { source: io_officer_id }
    is_accused:              { source: is_accused, transform: int }
    is_complainant_accused:  { source: is_complainant_accused, transform: int }

Case_Sections:
  fields:
    incident_id:   { source: incident_id }
    act_code:      { source: act_code }
    section_code:  { source: section_code }
    section_order: { source: section_order, transform: int }
    act_order:     { source: act_order, transform: int }

Courts:
  fields:
    court_id:      { source: court_id }
    name:          { source: name }
    district_code: { source: district_code }
    state_code:    { source: state_code }

Case_Status:
  fields:
    status_code: { source: status_code }
    status_name: { source: status_name }

Crime_Head_Sections:
  fields:
    crime_head:   { source: crime_head }
    act_code:     { source: act_code }
    section_code: { source: section_code }

Entities:
  fields:
    entity_id:        { source: entity_id }
    canonical_id:     { source: canonical_id }
    type:             { source: type }
    value:            { source: value }
    alias_of:         { source: alias_of }
    age:              { source: age, transform: int }
    gender:           { source: gender }
    match_confidence: { source: match_confidence, transform: float }

Incident_Edges:
  fields:
    incident_id:   { source: incident_id }
    entity_id:     { source: entity_id }
    role:          { source: role }
    edge_weight:   { source: edge_weight, transform: float }
    evidence_type: { source: evidence_type }
    is_police:     { source: is_police, transform: int }

# source file: data/synthetic/units.csv (organizer schema: Unit + UnitType)
Units:
  fields:
    unit_id:       { source: unit_id }
    unit_name:     { source: unit_name }
    unit_type:     { source: unit_type }
    parent_unit:   { source: parent_unit }
    district_code: { source: district_code }
    district_num:  { source: district_num }
    station_code:  { source: station_code }
    lat:           { source: lat,  transform: float }
    long:          { source: long, transform: float }

# source file: data/reference/census_2011.csv
Socioeconomic:
  fields:
    area_code:     { source: area_code }
    district_name: { source: district_name }
    population:   { source: population,   transform: int }
    density:      { source: density,      transform: float }
    literacy:     { source: literacy,     transform: float }
    urbanization: { source: urbanization, transform: float }

# source file: data/reference/geo_boundaries.csv
Geo_Boundaries:
  fields:
    area_code: { source: area_code }
    level:     { source: level }
    polygon:   { source: polygon }
