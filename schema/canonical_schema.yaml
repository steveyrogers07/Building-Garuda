# GARUDA — Canonical Data Store schema (single source of truth).
#
# Consumed by: ingestion/adapter/validate.py (the gate), ingestion/adapter/loader.py
# (coercion + which table), and schema/create_tables.md (console/SDK creation).
# Downstream engines/frontend read ONLY these canonical tables.
#
# Catalyst auto-adds ROWID, CREATORID, CREATEDTIME, MODIFIEDTIME to every table.
# Column types (Catalyst Data Store): Text, Int, BigInt, Decimal, Boolean, Date,
# DateTime, ForeignKey, AutoNumber.
#
# FK note: a Catalyst ForeignKey stores the *ROWID* of the referenced row, which is
# unknown at CSV-generation time and not settable via console Import. So join columns
# in Incident_Edges are modelled as Text business keys (incident_id / entity_id) that
# reference the business keys in Incidents/Entities. ZCQL joins use those business keys
# (see schema/create_tables.md). loader.py can optionally remap them to true ROWID FKs
# after the parent rows are inserted (--remap-fk); default is business keys.

meta:
  auto_columns: [ROWID, CREATORID, CREATEDTIME, MODIFIEDTIME]
  types: [Text, Int, BigInt, Decimal, Boolean, Date, DateTime, ForeignKey, AutoNumber]

tables:

  # ---------- CORE (populated in Phase 2) ----------

  Incidents:
    phase: 2
    populate: true
    description: One row per FIR / crime incident — the spine of the platform.
    business_key: incident_id
    columns:
      - { name: incident_id,   type: Text,     nullable: false, unique: true }
      - { name: fir_no,        type: Text,     nullable: false }
      # CaseMaster.CrimeNo/CaseNo — organizer's 18-digit decodable key (1 category
      # + 4 district + 4 unit + 4 year + 5 serial); CaseNo = the last 9 digits.
      - { name: crime_no,      type: Text,     nullable: true, unique: true }
      - { name: case_no,       type: Text,     nullable: true }
      - { name: occurred_at,   type: DateTime, nullable: false }
      - { name: reported_at,   type: DateTime, nullable: true }
      - { name: district_code, type: Text,     nullable: false }
      - { name: station_code,  type: Text,     nullable: true }
      - { name: crime_type,    type: Text,     nullable: false }
      - { name: ipc_bns_code,  type: Text,     nullable: true }
      - { name: lat,           type: Decimal,  nullable: true }
      - { name: long,          type: Decimal,  nullable: true }
      - { name: address_text,  type: Text,     nullable: true }
      - { name: mo_text,       type: Text,     nullable: true }
      - { name: status,        type: Text,     nullable: true }
      - { name: case_category, type: Text,     nullable: true }   # FIR|UDR|PAR|Zero-FIR (CaseMaster.CaseCategoryID)
      - { name: gravity,       type: Text,     nullable: true }   # Heinous|Non-Heinous (CaseMaster.GravityOffenceID)
      - { name: officer_id,    type: Text,     nullable: true, ref: Officers.officer_id }  # CaseMaster.PolicePersonID
      - { name: incident_to_date,        type: DateTime, nullable: true }   # CaseMaster.IncidentToDate (end of a continuing offence)
      - { name: info_received_ps_date,   type: DateTime, nullable: true }   # CaseMaster.InfoReceivedPSDate (informal info reaches PS, precedes formal reported_at)
      - { name: court_id,      type: Text,     nullable: true, ref: Courts.court_id }  # CaseMaster.CourtID — court trying the case, once trial-eligible
      - { name: mo_cluster_id, type: Text,     nullable: true }   # filled in Phase 4
      - { name: series_id,     type: Text,     nullable: true }   # filled in Phase 5
      - { name: source_fir_url,type: Text,     nullable: true }
      - { name: confidence,    type: Decimal,  nullable: true }
      - { name: created_by,    type: Text,     nullable: true }

  Entities:
    phase: 2
    populate: true
    description: People / vehicles / phones mentioned in incidents. canonical_id groups aliases.
    business_key: entity_id
    columns:
      - { name: entity_id,        type: Text,    nullable: false, unique: true }
      - { name: canonical_id,     type: Text,    nullable: false }   # == entity_id for a canonical record; aliases point to parent's canonical_id
      - { name: type,             type: Text,    nullable: false }   # person | vehicle | phone
      - { name: value,            type: Text,    nullable: false }   # name / reg-no / phone-no
      - { name: alias_of,         type: Text,    nullable: true }    # entity_id of the canonical record this is an alias of
      - { name: age,              type: Int,     nullable: true }
      - { name: gender,           type: Text,    nullable: true }
      - { name: match_confidence, type: Decimal, nullable: true }

  Incident_Edges:
    phase: 2
    populate: true
    description: Incident <-> Entity links (the graph). Business-key join columns (see FK note).
    columns:
      - { name: incident_id,  type: Text,    nullable: false, ref: Incidents.incident_id }
      - { name: entity_id,    type: Text,    nullable: false, ref: Entities.entity_id }
      - { name: role,         type: Text,    nullable: false }   # suspect|victim|witness|vehicle_used|phone_used
      - { name: edge_weight,  type: Decimal, nullable: true }
      - { name: evidence_type,type: Text,    nullable: true }    # fir_named|cctv|recovered|call_record|witness
      - { name: is_police,    type: Boolean, nullable: true }    # Victim.VictimPolice — only meaningful when role == victim

  Socioeconomic:
    phase: 2
    populate: true
    description: Per-area socio-economic features for the WHY model.
    business_key: area_code
    columns:
      - { name: area_code,    type: Text,    nullable: false, unique: true }
      - { name: population,   type: Int,     nullable: true }
      - { name: density,      type: Decimal, nullable: true }
      - { name: literacy,     type: Decimal, nullable: true }
      - { name: urbanization, type: Decimal, nullable: true }

  Geo_Boundaries:
    phase: 2
    populate: true
    description: Area polygons (GeoJSON stored as text) for choropleths / spatial joins.
    business_key: area_code
    columns:
      - { name: area_code, type: Text, nullable: false, unique: true }
      - { name: level,     type: Text, nullable: false }   # state|district|taluk
      - { name: polygon,   type: Text, nullable: false }   # GeoJSON geometry as a string

  Officers:
    phase: 2
    populate: true
    description: >
      Investigating/registering officers (organizer schema's Employee, narrowed to what
      the platform needs — Rank + Designation + posting). Powers "who registered this FIR"
      on the case file and "who worked cases like this" (D3).
    business_key: officer_id
    columns:
      - { name: officer_id,    type: Text, nullable: false, unique: true }
      - { name: name,          type: Text, nullable: false }
      - { name: rank,          type: Text, nullable: true }    # Constable..DySP (Rank.RankName)
      - { name: designation,   type: Text, nullable: true }    # Investigating Officer|SHO|... (Designation.DesignationName)
      - { name: district_code, type: Text, nullable: true }    # Employee.DistrictID
      - { name: unit_code,     type: Text, nullable: true }    # Employee.UnitID (station)
      - { name: kgid,             type: Text, nullable: true }   # Employee.KGID — not analytics-load-bearing (P2 #13), schema-complete
      - { name: dob,              type: Date, nullable: true }   # Employee.EmployeeDOB
      - { name: blood_group,      type: Text, nullable: true }   # Employee.BloodGroupID
      - { name: appointment_date, type: Date, nullable: true }   # Employee.AppointmentDate

  Chargesheets:
    phase: 2
    populate: true
    description: >
      Final-report outcome per case (organizer schema's ChargesheetDetails) — the
      clearance/conviction signal nobody else in the dataset computes (blueprint §B1).
      Only cases that reached a terminal status get a row.
    business_key: cs_id
    columns:
      - { name: cs_id,       type: Text, nullable: false, unique: true }
      - { name: incident_id, type: Text, nullable: false, ref: Incidents.incident_id }
      - { name: cs_date,     type: Date, nullable: true }
      - { name: cs_type,     type: Text, nullable: false }   # A=Chargesheet | B=False Case | C=Undetected
      - { name: officer_id,  type: Text, nullable: true, ref: Officers.officer_id }

  Arrests:
    phase: 2
    populate: true
    description: >
      Arrest/surrender events per accused (organizer schema's ArrestSurrender, joined to
      Accused via inv_arrestsurrenderaccused). Starts the CrPC/BNSS 60/90-day default-bail
      clock (docs/product/08 §1); a suspect in an open case with no row here is the
      absconding-accused board (08 §6).
    business_key: arrest_id
    columns:
      - { name: arrest_id,     type: Text, nullable: false, unique: true }
      - { name: incident_id,   type: Text, nullable: false, ref: Incidents.incident_id }
      - { name: entity_id,     type: Text, nullable: false, ref: Entities.entity_id }  # the accused
      - { name: event_type,    type: Text, nullable: false }   # arrest | surrender
      - { name: event_date,    type: Date, nullable: false }
      - { name: district_code, type: Text, nullable: true }
      - { name: court_id,      type: Text, nullable: true, ref: Courts.court_id }  # production court (ArrestSurrender.CourtID)
      - { name: io_officer_id, type: Text, nullable: true, ref: Officers.officer_id }  # ArrestSurrender.IOID
      - { name: is_accused,             type: Boolean, nullable: true }   # ArrestSurrender.IsAccused (P2 #9) — primary vs co-accused
      - { name: is_complainant_accused, type: Boolean, nullable: true }   # ArrestSurrender.IsComplainantAccused (P2 #9) — rare cross-role/false-case signal

  Case_Sections:
    phase: 2
    populate: true
    description: >
      Every act+section invoked per case (organizer schema's ActSectionAssociation ->
      Act.ActCode + Section.SectionCode), one-to-many. Incidents.ipc_bns_code stays the
      primary/most-serious section (section_order 1) per docs/DATASET_REAL_SCHEMA.md;
      powers per-section evidence-gap analysis (docs/product/08 §5).
    columns:
      - { name: incident_id,   type: Text, nullable: false, ref: Incidents.incident_id }
      - { name: act_code,      type: Text, nullable: false }   # IPC | BNS | IT_ACT
      - { name: section_code,  type: Text, nullable: false }
      - { name: section_order, type: Int,  nullable: false }   # 1 = primary/most serious
      - { name: act_order,     type: Int,  nullable: false }   # ActSectionAssociation.ActOrderID (P2 #15) — orders the ACT, distinct from section_order

  Courts:
    phase: 2
    populate: true
    description: >
      Court master (organizer schema's Court) — referenced by Incidents.court_id (case
      trial court) and Arrests.court_id (production court). 3 per district (P2 #11).
    business_key: court_id
    columns:
      - { name: court_id,      type: Text, nullable: false, unique: true }
      - { name: name,          type: Text, nullable: false }
      - { name: district_code, type: Text, nullable: true }
      - { name: state_code,    type: Text, nullable: true }

  Case_Status:
    phase: 2
    populate: true
    description: >
      CaseStatusMaster (P2 #10) — the master lookup Incidents.status denormalizes
      from. Reference-only; no engine reads this table, it exists so the status
      field is backed by a proper master rather than a bare string.
    business_key: status_code
    columns:
      - { name: status_code, type: Text, nullable: false, unique: true }
      - { name: status_name, type: Text, nullable: false }   # matches Incidents.status text exactly

  Crime_Head_Sections:
    phase: 2
    populate: true
    description: >
      CrimeHeadActSection (P2 #14) — the organizer's 2-level crime classification:
      which act+sections are typically filed under each major CrimeHead. Reference
      table derived from crime_types config + case_sections.companions, not
      per-incident data.
    columns:
      - { name: crime_head,   type: Text, nullable: false }   # e.g. "Offences Against Property"
      - { name: act_code,     type: Text, nullable: false }
      - { name: section_code, type: Text, nullable: false }

  Units:
    phase: 2
    populate: true
    description: >
      Organizer schema Unit + UnitType — the police-unit hierarchy (State HQ →
      District Office → Police Station, self-referencing parent_unit). The 4-digit
      numeric ids are the segments CrimeNo encodes; station centroids power the
      hotspot map's station-level drill-down (/geo/stations).
    business_key: unit_id
    columns:
      - { name: unit_id,       type: Text,    nullable: false, unique: true }
      - { name: unit_name,     type: Text,    nullable: false }
      - { name: unit_type,     type: Text,    nullable: false }  # Police Station | District Office | State HQ
      - { name: parent_unit,   type: Text,    nullable: true, ref: Units.unit_id }
      - { name: district_code, type: Text,    nullable: true }
      - { name: district_num,  type: Text,    nullable: true }   # 4-digit CrimeNo segment
      - { name: station_code,  type: Text,    nullable: true }   # -> Incidents.station_code
      - { name: lat,           type: Decimal, nullable: true }
      - { name: long,          type: Decimal, nullable: true }

  # ---------- DERIVED (created empty in Phase 2; filled later) ----------

  MO_Clusters:
    phase: 4
    populate: false
    description: MO fingerprint clusters (HDBSCAN over MO embeddings + features).
    columns:
      - { name: cluster_id,          type: Text, nullable: false, unique: true }
      - { name: crime_type,          type: Text, nullable: true }
      - { name: size,                type: Int,  nullable: true }
      - { name: label,               type: Text, nullable: true }
      - { name: centroid_features,   type: Text, nullable: true }   # JSON
      - { name: exemplar_incident_id,type: Text, nullable: true }

  Crime_Series:
    phase: 5
    populate: false
    description: Linked crime series (MO + space-time near-repeat).
    columns:
      - { name: series_id,      type: Text, nullable: false, unique: true }
      - { name: crime_type,     type: Text, nullable: true }
      - { name: district_code,  type: Text, nullable: true }
      - { name: locality,       type: Text, nullable: true }
      - { name: start_date,     type: Date, nullable: true }
      - { name: end_date,       type: Date, nullable: true }
      - { name: incident_count, type: Int,  nullable: true }
      - { name: method,         type: Text, nullable: true }

  Predictive_Risk:
    phase: 6
    populate: false
    description: Backtested risk score per grid x period.
    columns:
      - { name: grid_id,       type: Text,    nullable: false }
      - { name: district_code, type: Text,    nullable: true }
      - { name: period,        type: Date,    nullable: true }
      - { name: risk_score,    type: Decimal, nullable: true }
      - { name: rank,          type: Int,     nullable: true }
      - { name: top_drivers,   type: Text,    nullable: true }   # SHAP JSON
      - { name: model_version, type: Text,    nullable: true }

  Alerts:
    phase: 5
    populate: false
    description: Anomaly / emerging-trend alerts.
    columns:
      - { name: alert_id,     type: Text,     nullable: false, unique: true }
      - { name: type,         type: Text,     nullable: true }
      - { name: district_code,type: Text,     nullable: true }
      - { name: crime_type,   type: Text,     nullable: true }
      - { name: severity,     type: Text,     nullable: true }
      - { name: window_start, type: DateTime, nullable: true }
      - { name: window_end,   type: DateTime, nullable: true }
      - { name: detail,       type: Text,     nullable: true }
      - { name: status,       type: Text,     nullable: true }

  Review_Queue:
    phase: 3
    populate: false
    description: Human-in-the-loop queue for OCR/extraction output before promotion to Incidents.
    columns:
      - { name: review_id,        type: Text,     nullable: false, unique: true }
      - { name: source_fir_url,   type: Text,     nullable: true }
      - { name: extracted_json,   type: Text,     nullable: true }
      - { name: field_confidences,type: Text,     nullable: true }
      - { name: status,           type: Text,     nullable: true }   # pending|approved|rejected
      - { name: reviewer,         type: Text,     nullable: true }
      - { name: created_at,       type: DateTime, nullable: true }

  Audit_Log:
    phase: 9
    populate: false
    description: Governance audit trail — every privileged read/query.
    columns:
      - { name: log_id,     type: Text,     nullable: false, unique: true }
      - { name: actor,      type: Text,     nullable: true }
      - { name: role,       type: Text,     nullable: true }
      - { name: action,     type: Text,     nullable: true }
      - { name: resource,   type: Text,     nullable: true }
      - { name: query_text, type: Text,     nullable: true }
      - { name: ts,         type: DateTime, nullable: true }
      - { name: ip,         type: Text,     nullable: true }
